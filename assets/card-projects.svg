<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Featured Projects: UBARA and SkillUp AI">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100a10"/><stop offset="1" stop-color="#1b0b17"/></linearGradient></defs>
  <rect x="2" y="2" width="1196" height="346" rx="18" fill="url(#bg)" stroke="#7d2453" stroke-width="2"/>
  <rect x="2" y="2" width="7" height="346" rx="4" fill="#ff4fa3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="38" y="48" fill="#ff80bd" font-size="17" font-weight="700" letter-spacing="3">FEATURED PROJECTS</text>
    <line x1="38" y1="68" x2="1160" y2="68" stroke="#ff4fa3" stroke-opacity=".22"/>

    <rect x="30" y="88" width="555" height="232" rx="14" fill="#09080c" stroke="#52203e"/>
    <circle cx="66" cy="124" r="17" fill="#321126"/><text x="66" y="130" text-anchor="middle" fill="#ff80bd" font-size="16" font-weight="800">U</text>
    <text x="96" y="130" fill="#fff7fb" font-size="21" font-weight="700">UBARA</text>
    <text x="48" y="158" fill="#ff80bd" font-size="13" font-weight="600">Universitas Bengkulu Academic Response Assistant</text>
    <text x="48" y="190" fill="#cbbfc8" font-size="14">A university information chatbot that uses Retrieval-Augmented</text>
    <text x="48" y="211" fill="#cbbfc8" font-size="14">Generation to provide answers based on official Universitas</text>
    <text x="48" y="232" fill="#cbbfc8" font-size="14">Bengkulu documents.</text>
    <text x="48" y="259" fill="#9e8d99" font-size="12">React · Vite · Express.js · Python · FAISS · Sentence Transformers</text>
    <text x="48" y="278" fill="#9e8d99" font-size="12">LangChain · Groq API</text>
    <text x="48" y="304" fill="#ff9cc8" font-size="10.5" font-style="italic">UBARA is designed to make academic and university information easier to access for</text>
    <text x="48" y="319" fill="#ff9cc8" font-size="10.5" font-style="italic">students, prospective students, and the public.</text>

    <rect x="615" y="88" width="555" height="232" rx="14" fill="#09080c" stroke="#52203e"/>
    <circle cx="651" cy="124" r="17" fill="#321126"/><text x="651" y="130" text-anchor="middle" fill="#ff80bd" font-size="16" font-weight="800">S</text>
    <text x="681" y="130" fill="#fff7fb" font-size="21" font-weight="700">SkillUp AI — Intelligent Tutor System</text>
    <text x="633" y="174" fill="#cbbfc8" font-size="14">An adaptive public-speaking learning platform that combines</text>
    <text x="633" y="195" fill="#cbbfc8" font-size="14">personalized learning with AI-based body posture, hand gesture,</text>
    <text x="633" y="216" fill="#cbbfc8" font-size="14">and eye-contact analysis.</text>
    <text x="633" y="259" fill="#9e8d99" font-size="13">React · Node.js · TensorFlow.js · MoveNet</text>
    <text x="633" y="280" fill="#9e8d99" font-size="13">Cosine Similarity</text>
  </g>
</svg>
