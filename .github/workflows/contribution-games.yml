name: Generate contribution games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff4fa3&color_dots=fff0f7,f9c0d9,f27eac,e83e88,b51768
            dist/github-contribution-grid-snake-dark.svg?color_snake=ff66b3&color_dots=0d0714,3a0d2e,711348,b5165b,ff4f9a

      - name: Publish games to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
